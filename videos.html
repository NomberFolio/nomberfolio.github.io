<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<title>Videos | NomberFax — Web3 Content Creator & Designer</title>
<link rel="canonical" href="https://nomberfolio.github.io/videos/">
<script>
(function(){
  function slug(s){return String(s).toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
  var q=new URLSearchParams(location.search);
  var topic=q.get('topic')||'';
  var year=q.get('year')||'';
  var h=decodeURIComponent((location.hash||'').replace(/^#/,'')||'');
  if(h && h.indexOf('vm-')!==0){
    h.split('/').forEach(function(p){
      if(/^\d{4}$/.test(p)) year=year||p;
      else if(!topic) topic=p;
    });
  }
  var path='/videos/'+(topic && !/^all$/i.test(topic) ? slug(topic)+'/' : '');
  if(year && /^\d{4}$/.test(year)) path+='?year='+encodeURIComponent(year);
  location.replace(path);
})();
</script>
<meta http-equiv="refresh" content="0;url=/videos/">
</head>
<body>
<p style="font-family:Inter,system-ui,sans-serif;padding:40px;color:#ecebf5;background:#07070d">Redirecting to <a href="/videos/" style="color:#00e5ff">the videos page</a>.</p>
</body>
</html>
